name: matrix

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matrix
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/github-script@v7
        id: contributions
        with:
          script: |
            const { data } = await github.graphql(`
              query($login: String!) {
                user(login: $login) {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                        }
                      }
                    }
                  }
                }
              }
            `, { login: context.repo.owner })
            require('fs').writeFileSync(
              'contributions.json',
              JSON.stringify(data.user.contributionsCollection.contributionCalendar),
            )

      - name: Generate matrix
        run: python3 scripts/generate_matrix.py --input contributions.json --output assets/matrix-contribution-graph.svg --seed 42

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/matrix-contribution-graph.svg
          git diff --cached --quiet || git commit -m "chore: regenerate matrix contribution graph"
          git push
